<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Kalchi Kill</title>
<style>
:root{color-scheme:dark;--bg:#0b0e11;--panel:#14181d;--panel2:#101419;--muted:#8d98a4;--text:#f4f7fa;--line:#29313a;--good:#2bd576;--bad:#ff5b67;--warn:#ffbf47;--accent:#7dc4ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1080px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:4px 0 16px}h1{font-size:22px;margin:0}h2{font-size:17px;margin:24px 0 8px}.status{display:flex;gap:7px;flex-wrap:wrap}.pill{border:1px solid var(--line);padding:5px 8px;border-radius:999px;font-size:11px;color:var(--muted)}.ok{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:10px 0;padding:14px}.subcard{background:var(--panel2);border:1px solid #202831;border-radius:11px;padding:12px;margin-top:11px}.rowhead{display:flex;justify-content:space-between;gap:12px}.title{font-weight:800;font-size:16px}.subtitle,.small,.label{font-size:12px;color:var(--muted)}.ticker{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:#6f7b87;margin-top:3px}.price{font-size:29px;font-weight:850;margin:10px 0 2px}.stats{display:flex;gap:16px;flex-wrap:wrap;margin-top:9px}.stat strong{display:block;font-size:14px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}label{display:block;font-size:11px;color:var(--muted);margin:0 0 4px}input,select{width:100%;background:#0d1115;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:15px;min-height:40px}button{border:0;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer;background:#e7edf3;color:#0b0e11;min-height:40px}.danger{background:var(--bad);color:#fff}.secondary{background:#2a323b;color:#fff}.accent{background:#bfe3ff}.actions{display:flex;gap:8px;align-items:end}.error{margin-top:8px;color:var(--bad);font-size:12px}.empty{text-align:center;color:var(--muted);padding:28px 10px}.events{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--muted);max-height:230px;overflow:auto}.event{padding:5px 0;border-bottom:1px solid #20262d}.login{max-width:380px;margin:18vh auto}.login input{margin:12px 0}.login button{width:100%}.banner{padding:10px 12px;border-radius:9px;background:#302510;color:#ffd37d;font-size:13px;margin-bottom:12px}.sectionnote{font-size:12px;color:var(--muted);margin-bottom:10px}.namePreview{font-size:13px;color:var(--accent);min-height:19px;margin-top:6px}.planStatus{font-weight:800;font-size:12px}.waiting_entry{color:var(--warn)}.waiting_exit{color:var(--good)}.completed{color:var(--muted)}
@media(max-width:760px){.grid,.grid3{grid-template-columns:1fr 1fr}.wrap{padding:11px}.price{font-size:26px}.top{align-items:flex-start;flex-direction:column}.actions{grid-column:1/-1}.actions button{width:100%}}
@media(max-width:450px){.grid,.grid3,.grid2{grid-template-columns:1fr}.actions{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="login"><h1>Kalchi Kill</h1><input id="pw" type="password" placeholder="Dashboard password" autocomplete="current-password"><button onclick="login()">Sign in</button><div id="loginerr" class="error"></div></div></div>
<script>
const app=document.getElementById('app');let timer=null,pendingState=null;
const cents=v=>v==null?'—':(Number(v)*100).toFixed(1)+'¢';
const money=v=>v==null?'—':(Number(v)>=0?'+':'')+'$'+Number(v).toFixed(2);
const pct=v=>v==null?'—':(Number(v)>=0?'+':'')+Number(v).toFixed(1)+'%';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const editing=()=>['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName);
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});if(r.status===401)throw new Error('AUTH');const x=await r.json().catch(()=>({}));if(!r.ok)throw new Error(x.detail||'Request failed');return x}
async function login(){try{await api('/api/login',{method:'POST',body:JSON.stringify({password:document.getElementById('pw').value})});await refresh(true);start()}catch(e){document.getElementById('loginerr').textContent=e.message==='AUTH'?'Wrong password':e.message}}
function start(){if(timer)clearInterval(timer);timer=setInterval(()=>refresh(false),500)}
function modeLabel(m){return m==='price'?'Price':m==='pnl_dollars'?'P/L $':'P/L %'}
function modeValue(st){if(!st)return'';return st.trigger_mode==='price'?(Number(st.trigger)*100).toFixed(1):Number(st.trigger).toFixed(st.trigger_mode==='pnl_dollars'?2:1)}
function sideName(market,direction){return direction==='YES'?(market.yes_label||'YES'):(market.no_label||'NO')}
function operatorOptions(v){return `<option value="lte" ${v==='lte'?'selected':''}>≤</option><option value="gte" ${v==='gte'?'selected':''}>≥</option>`}
function modeOptions(v){return `<option value="price" ${v==='price'?'selected':''}>Price (¢)</option><option value="pnl_dollars" ${v==='pnl_dollars'?'selected':''}>P/L ($)</option><option value="pnl_percent" ${v==='pnl_percent'?'selected':''}>P/L (%)</option>`}
async function saveStop(ticker,armed){const k=CSS.escape(ticker);try{await api('/api/stops/'+encodeURIComponent(ticker),{method:'PUT',body:JSON.stringify({trigger_mode:document.getElementById('mode-'+k).value,operator:document.getElementById('op-'+k).value,trigger_value:document.getElementById('trig-'+k).value,slippage_cents:document.getElementById('slip-'+k).value,armed})});await refresh(true)}catch(e){alert(e.message)}}
async function lookupMarket(){const t=document.getElementById('entryTicker').value.trim().toUpperCase();if(!t)return;const el=document.getElementById('marketPreview');try{const m=await api('/api/markets/'+encodeURIComponent(t));el.textContent=(m.title||t)+(m.subtitle?' — '+m.subtitle:'')}catch(e){el.textContent=e.message}}
async function createEntry(){const g=id=>document.getElementById(id).value;try{await api('/api/entries',{method:'POST',body:JSON.stringify({ticker:g('entryTicker').trim().toUpperCase(),direction:g('entrySide'),quantity:g('entryQty'),entry_operator:g('entryOp'),entry_trigger_cents:g('entryPrice'),entry_slippage_cents:g('entrySlip'),exit_mode:g('exitMode'),exit_operator:g('exitOp'),exit_trigger_value:g('exitValue'),exit_slippage_cents:g('exitSlip')})});await refresh(true)}catch(e){alert(e.message)}}
async function cancelPlan(id){if(!confirm('Cancel this trigger? If it already entered, this cancels only its linked exit and leaves the position open.'))return;try{await api('/api/entries/'+encodeURIComponent(id),{method:'DELETE'});await refresh(true)}catch(e){alert(e.message)}}
function positionCard(p){const st=p.stop||{};const armed=!!st.armed;const mode=st.trigger_mode||'price';const op=st.operator||'lte';const trigger=modeValue(st);const slip=st.slippage!=null?(Number(st.slippage)*100).toFixed(1):'3.0';const m=p.market||{};return `<div class="card"><div class="rowhead"><div><div class="title">${esc(m.title||p.ticker)}</div><div class="subtitle">${esc(m.subtitle||'')}</div><div class="ticker">${esc(p.ticker)}</div></div><div><div class="planStatus ${armed?'bad':''}">${armed?'ARMED':'DISARMED'}</div><div class="small">${esc(p.direction)} · ${esc(sideName(m,p.direction))}</div></div></div><div class="price">${cents(p.held_bid)}</div><div class="label">Executable exit bid · ${esc(p.quantity)} contracts</div><div class="stats"><div class="stat"><span class="label">Avg entry</span><strong>${cents(p.avg_entry)}</strong></div><div class="stat"><span class="label">P/L</span><strong class="${Number(p.pnl_dollars)>=0?'ok':'bad'}">${money(p.pnl_dollars)}</strong></div><div class="stat"><span class="label">P/L %</span><strong class="${Number(p.pnl_percent)>=0?'ok':'bad'}">${pct(p.pnl_percent)}</strong></div></div><div class="grid"><div><label>Exit trigger based on</label><select id="mode-${esc(p.ticker)}">${modeOptions(mode)}</select></div><div><label>Condition</label><select id="op-${esc(p.ticker)}">${operatorOptions(op)}</select></div><div><label>Trigger value</label><input id="trig-${esc(p.ticker)}" type="number" step="0.01" value="${trigger}" placeholder="Price¢ / P&L"></div><div><label>Max exit slippage (¢)</label><input id="slip-${esc(p.ticker)}" type="number" min="0" max="25" step="0.1" value="${slip}"></div><div class="actions"><button class="${armed?'secondary':'danger'}" onclick="saveStop('${esc(p.ticker)}',${!armed})">${armed?'Disarm exit':'Arm exit'}</button></div></div>${st.last_error?`<div class="error">${esc(st.last_error)}</div>`:''}</div>`}
function planCard(p){const m=p.market||{};const exitMetric=p.exit_mode==='price'?cents(p.exit_metric):p.exit_mode==='pnl_dollars'?money(p.exit_metric):pct(p.exit_metric);return `<div class="card"><div class="rowhead"><div><div class="title">${esc(m.title||p.ticker)}</div><div class="subtitle">${esc(m.subtitle||'')}</div><div class="ticker">${esc(p.ticker)}</div></div><div class="planStatus ${esc(p.status)}">${esc(p.status.replaceAll('_',' ').toUpperCase())}</div></div><div class="stats"><div class="stat"><span class="label">Entry</span><strong>${esc(p.direction.toUpperCase())} ${esc(p.quantity)}</strong></div><div class="stat"><span class="label">Entry trigger</span><strong>${esc(p.entry_operator==='lte'?'≤':'≥')} ${(Number(p.entry_trigger)*100).toFixed(1)}¢</strong></div><div class="stat"><span class="label">Live buy price</span><strong>${cents(p.live_entry_price)}</strong></div><div class="stat"><span class="label">Filled entry</span><strong>${p.entry_price?cents(p.entry_price):'—'}</strong></div><div class="stat"><span class="label">Linked qty open</span><strong>${esc(p.open_qty)}</strong></div><div class="stat"><span class="label">Exit</span><strong>${modeLabel(p.exit_mode)} ${esc(p.exit_operator==='lte'?'≤':'≥')} ${p.exit_mode==='price'?(Number(p.exit_trigger)*100).toFixed(1)+'¢':esc(p.exit_trigger)}</strong></div><div class="stat"><span class="label">Current exit metric</span><strong>${exitMetric}</strong></div></div><div style="margin-top:12px"><button class="secondary" onclick="cancelPlan('${esc(p.plan_id)}')">Cancel trigger</button></div>${p.last_error?`<div class="error">${esc(p.last_error)}</div>`:''}</div>`}
function entryForm(){return `<h2>New entry → linked exit</h2><div class="sectionnote">Entry triggers use the executable market buy price. Once the entry fills, its linked exit can trigger by price, dollar P/L, or percentage P/L and tracks only that entry's filled quantity.</div><div class="card"><div class="grid3"><div><label>Kalshi market ticker</label><input id="entryTicker" placeholder="Paste ticker from Kalshi"></div><div class="actions"><button class="secondary" onclick="lookupMarket()">Decode market name</button></div><div id="marketPreview" class="namePreview"></div></div><div class="subcard"><div class="grid"><div><label>Entry side</label><select id="entrySide"><option value="yes">YES</option><option value="no">NO</option></select></div><div><label>Contracts</label><input id="entryQty" type="number" min="0.01" step="0.01" value="10"></div><div><label>Enter when price</label><select id="entryOp"><option value="lte">≤</option><option value="gte">≥</option></select></div><div><label>Entry trigger (¢)</label><input id="entryPrice" type="number" min="0.01" max="99.99" step="0.1" placeholder="54.0"></div><div><label>Max entry slippage (¢)</label><input id="entrySlip" type="number" min="0" max="25" step="0.1" value="2.0"></div></div></div><div class="subcard"><div class="grid"><div><label>Linked exit based on</label><select id="exitMode">${modeOptions('price')}</select></div><div><label>Exit when</label><select id="exitOp"><option value="gte">≥</option><option value="lte">≤</option></select></div><div><label>Exit trigger value</label><input id="exitValue" type="number" step="0.01" placeholder="Price¢ / P&L"></div><div><label>Max exit slippage (¢)</label><input id="exitSlip" type="number" min="0" max="25" step="0.1" value="3.0"></div><div class="actions"><button class="accent" onclick="createEntry()">Arm entry + linked exit</button></div></div></div></div>`}
function render(s){const y=window.scrollY;const conn=s.ws_connected?'<span class="pill ok">● Live feed</span>':'<span class="pill bad">● Feed offline</span>';const exec=s.execution_enabled?'<span class="pill ok">LIVE EXECUTION</span>':'<span class="pill warn">SIMULATION</span>';const cfg=s.kalshi_configured?'':'<span class="pill bad">Credentials missing</span>';let html=`<div class="top"><h1>Kalchi Kill</h1><div class="status">${conn}${exec}<span class="pill">${esc(s.environment).toUpperCase()}</span>${cfg}</div></div>`;if(!s.execution_enabled)html+=`<div class="banner">Execution is disabled. Triggers are simulated only.</div>`;html+=entryForm();html+='<h2>Armed / linked entries</h2>';html+=s.entry_plans?.length?s.entry_plans.map(planCard).join(''):'<div class="card empty">No entry triggers configured.</div>';html+='<h2>Current Kalshi positions</h2>';const open=s.positions.filter(p=>Number(p.position)!==0||p.stop);html+=open.length?open.map(positionCard).join(''):'<div class="card empty">No open Kalshi positions detected.</div>';html+='<h2>Execution log</h2><div class="card"><div class="events">'+(s.events.length?s.events.map(e=>`<div class="event">${new Date(e.ts*1000).toLocaleTimeString()} ${esc(e.ticker||'')} ${esc(e.message)}</div>`).join(''):'No events yet')+'</div></div>';app.innerHTML=html;requestAnimationFrame(()=>window.scrollTo(0,y))}
async function refresh(force=false){try{const s=await api('/api/state');if(!force&&editing()){pendingState=s;return}pendingState=null;render(s)}catch(e){if(e.message==='AUTH'){if(timer)clearInterval(timer);app.innerHTML='<div class="login"><h1>Kalchi Kill</h1><input id="pw" type="password" placeholder="Dashboard password"><button onclick="login()">Sign in</button><div id="loginerr" class="error"></div></div>'}}}
refresh(true).then(start).catch(()=>{});
</script>
</body>
</html>
